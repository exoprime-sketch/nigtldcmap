name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-gate:
    name: V136 blocking release gate
    runs-on: ubuntu-latest
    # Historical successful runs took 7-20 minutes. A stalled audit now fails
    # individually; do not leave the whole job waiting for three hours.
    timeout-minutes: 45
    env:
      CI: "true"

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Resolve Chrome executable
        shell: bash
        run: |
          browser_path="$(command -v google-chrome || command -v chromium-browser || command -v chromium || true)"
          if [[ -z "$browser_path" ]]; then
            curl --fail --location --silent --show-error \
              --output "$RUNNER_TEMP/google-chrome-stable_current_amd64.deb" \
              https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
            sudo apt-get update
            sudo apt-get install --yes "$RUNNER_TEMP/google-chrome-stable_current_amd64.deb"
            browser_path="$(command -v google-chrome)"
          fi
          "$browser_path" --version
          echo "V125_BROWSER_EXECUTABLE=$browser_path" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: npm ci

      - name: Run V136 blocking release gate
        timeout-minutes: 30
        run: npm run finalize:v136

      # Home/finder/map role split (52 checks) and the 152 card→detail
      # analysis QA (real card clicks, same-meaning value checks, selector
      # effects, map hand-off). Both exit 1 on a required failure.
      - name: Run V140 card and detail analysis gates
        timeout-minutes: 60
        run: |
          npm run qa:role-split:v140
          npm run qa:analysis:v140

      - name: Upload V140 QA reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: v140-qa-reports
          path: |
            reports/v140/role-split-qa-v140*.json
            reports/v140/analysis-qa-v140-*.json
            reports/v140/analysis-qa-v140-*.md
          if-no-files-found: ignore

      - name: Verify deployment and security contracts
        run: |
          npm run audit:deployment:v128
          npm run audit:security:v128

      - name: Record performance advisory
        continue-on-error: true
        run: |
          npm run audit:performance:v128

      - name: Rebuild root-domain artifact
        env:
          GENERATE_SOURCEMAP: "false"
        run: npm run build

      - name: Upload production build
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: vietnam-pilot-build-${{ github.sha }}
          path: build/
          if-no-files-found: error
          retention-days: 14

      - name: Upload V136 release reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: vietnam-pilot-reports-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            reports/v136/
            reports/v135/
            reports/v134/
            reports/v133/
            reports/v132/
            reports/v131/
            reports/v130/
            !reports/v133/**/*.zip
            !reports/v133/**/*.xlsx
            !reports/v133/**/*.xls
            !reports/v130/screenshots/**
            !reports/v131/screenshots/**
            !reports/v132/screenshots/**
            !reports/v133/screenshots/**
            !reports/v134/screenshots/**
            !reports/v135/screenshots/**
            !reports/v136/screenshots/**
            !reports/v134/**/*.zip
            !reports/v134/**/*.xlsx
            !reports/v134/**/*.xls
          if-no-files-found: warn
          retention-days: 30
