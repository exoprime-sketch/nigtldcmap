# Playwright end-to-end suite — advisory.
#
# This runs alongside the blocking V136 release gate, not in place of it. It
# exercises the candidate build the way a reader does: every detail screen, the
# map with real pointer input, the recommended analyses, the comparison, the
# five widths and an actual file download. Failures here are read, not enforced,
# until the suite has been stable across several runs; the gate that blocks a
# merge is still `finalize:v136` in ci.yml.
name: E2E (advisory)

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  playwright:
    name: Playwright against the candidate build
    runs-on: ubuntu-latest
    # Advisory: a failure is reported on the run, and does not block the merge.
    continue-on-error: true
    timeout-minutes: 45
    env:
      CI: "true"

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright's Chromium
        run: npx playwright install --with-deps chromium

      - name: Build the candidate
        # The suite tests the build the release QA measures, assembled by the
        # same script, from the data the repository ships.
        run: node scripts/v137/build-candidate-v137.mjs --data public/data/vietnam/v2

      - name: Run the suite
        run: npx playwright test

      - name: Keep the failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            reports/final-data-integration/playwright-report
            reports/final-data-integration/playwright-artifacts
          retention-days: 14
          if-no-files-found: ignore
